# Explicit HBA so that REPLICATION connections from the hot standby are allowed.
# The stock image only writes "host all all all <method>", which does not cover
# replication connections.
#
# Assumption: Postgres is reachable only on the internal Compose network, so trust
# auth is acceptable for this coursework. Production would use scram-sha-256 and a
# replication-only entry scoped to the standby's address.
local   all         all                     trust
host    all         all     127.0.0.1/32    trust
host    all         all     ::1/128         trust
host    all         all     all             trust
host    replication repl    all             trust
